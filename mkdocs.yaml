site_name: PySTAC extension generator
site_description: Generate standalone PySTAC-compatible extension classes from STAC Extension JSON Schemas.
site_url: https://terradue.github.io/pystac-ext-generator/
repo_url: https://github.com/Terradue/pystac-ext-generator
repo_name: pystac-ext-generator
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/index.md
      - First steps: tutorials/first-steps.md
  - How-to guides:
      - Overview: how-to/index.md
      - Install: how-to/install.md
      - Use generated extensions: how-to/use-extension.md
      - Bundle external references: how-to/references.md
  - Reference:
      - Overview: reference/index.md
      - CLI: reference/cli.md
      - Generated classes and fields: reference/fields.md
      - Python API: reference/api.md
  - Explanation:
      - Overview: explanation/index.md
      - Architecture: explanation/architecture.md

theme:
  name: readthedocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
